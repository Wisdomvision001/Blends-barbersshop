name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          mkdir -p pages
          cp -r dist/. pages/

          if [ -f fade-house-premium.css ]; then
            cp fade-house-premium.css pages/
          fi

          if [ -f logo.svg ]; then
            cp logo.svg pages/
          fi

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest pages/
          fi

          if [ -d images ]; then
            cp -r images pages/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4